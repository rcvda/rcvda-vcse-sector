name: Release plugin

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip
      - name: Build plugin zip (refreshes bundled data, repackages)
        run: ./build/build.sh
      - name: Publish release with plugin asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/rcvda-vcse-sector.zip --title "${GITHUB_REF_NAME}" --generate-notes
